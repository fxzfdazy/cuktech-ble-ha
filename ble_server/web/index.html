<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUKTECH 10 GaN Charger Ultra</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preload" href="/static/chart.umd.min.js" as="script">
    <link rel="preload" href="/static/charger.png" as="image">
    <script defer src="/static/chart.umd.min.js"></script>
    <script defer src="/static/charge_history.js"></script>
    <script src="/static/chart-loader.js"></script>
    <script src="/static/chart-config.js"></script>
    <link rel="stylesheet" href="static/index.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/static/logo_footer.png" alt="CUKTECH" style="height: 40px; margin-bottom: 12px; filter: brightness(1.2);">
        </div>

        <div class="card">
            <div class="charger-layout">
                <div class="charger-image">
                    <div class="device-wrap" id="deviceWrap">
                        <!-- Unconnected -->
                        <img class="unconnected-img" id="unconnectedImg"
                             src="/static/plugin_imgs/main_card_ad1204u_unconnected.png" alt="CUKTECH Charger">
                        <!-- Animated device -->
                        <div class="device-wrap-inner">
                            <div class="device-charger" id="deviceChargerAnim">
                                <div class="dark-glow-ani" id="darkGlowAni"></div>
                                <div class="scene-badge-ani" id="sceneBadgeAni">
                                    <img id="sceneBadgeIconAni" src="" alt="">
                                    <span id="sceneBadgeTextAni"></span>
                                </div>
                                <img class="device-img" id="deviceImgAni" src="/static/plugin_imgs/main_charger_dark_ad1204_all.png" alt="">
                                <div class="usb-overlay-ani" id="usbOverlayAni">
                                    <!-- C1 --><div class="usb-mod-ani" id="usbModC1" style="top:25%"><div class="usb-picon" style="top:1px"><img id="usbPiconC1" src="/static/plugin_imgs/main_charger_dark_power_on.png" alt=""></div><div class="usb-pbg" style="top:0;width:57%;height:24px"><img src="/static/plugin_imgs/main_card_usb_c_rectangle.png" alt="" style="width:100%;height:100%"></div><div class="usb-pval" id="usbPvalC1" style="top:7px">0W</div></div>
                                    <!-- C2 --><div class="usb-mod-ani" id="usbModC2" style="top:35%"><div class="usb-picon" style="top:1px"><img id="usbPiconC2" src="/static/plugin_imgs/main_charger_dark_power_on.png" alt=""></div><div class="usb-pbg" style="top:0;width:57%;height:24px"><img src="/static/plugin_imgs/main_card_usb_c_rectangle.png" alt="" style="width:100%;height:100%"></div><div class="usb-pval" id="usbPvalC2" style="top:7px">0W</div></div>
                                    <!-- C3 --><div class="usb-mod-ani" id="usbModC3" style="top:45%"><div class="usb-picon" style="top:1px"><img id="usbPiconC3" src="/static/plugin_imgs/main_charger_dark_power_on.png" alt=""></div><div class="usb-pbg" style="top:0;width:57%;height:24px"><img src="/static/plugin_imgs/main_card_usb_c_rectangle.png" alt="" style="width:100%;height:100%"></div><div class="usb-pval" id="usbPvalC3" style="top:7px">0W</div></div>
                                    <!-- A --><div class="usb-mod-ani" id="usbModA" style="top:55%"><div class="usb-picon" style="top:1px"><img id="usbPiconA" src="/static/plugin_imgs/main_charger_dark_power_on.png" alt=""></div><div class="usb-pbg" style="top:0;left:42%;width:57%;height:24px"><img src="/static/plugin_imgs/main_card_usb_a_rectangle.png" alt="" style="width:100%;height:100%"></div><div class="usb-pval" id="usbPvalA" style="top:7px;">0W</div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="charger-controls">
                    <div class="control-box">
                        <div class="control-label" style="display: flex; justify-content: space-between; align-items: baseline;">
                            <span>连接状态</span>
                            <span id="firmwareVersion" style="font-weight: 400; font-size: 10px;"></span>
                        </div>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <div style="position: relative;">
                                <div id="statusBadge" class="status-badge disconnected">
                                    <span class="status-dot"></span>
                                    <span>BLE</span>
                                </div>
                                <div id="qualityTooltip" class="quality-tooltip" style="display:none;"></div>
                            </div>
                            <div style="position: relative;">
                                <div id="mqttBadge" class="status-badge disconnected">
                                    <span class="status-dot"></span>
                                    <span>MQTT</span>
                                </div>
                                <div id="mqttTooltip" class="quality-tooltip" style="display:none;"></div>
                            </div>
                            <div style="position: relative;">
                                <div id="bemfaBadge" class="status-badge disconnected">
                                    <span class="status-dot"></span>
                                    <span>Bemfa</span>
                                </div>
                                <div id="bemfaTooltip" class="quality-tooltip" style="display:none;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="control-box">
                        <div class="control-label">BLE 控制</div>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="bleToggle" onclick="bleToggle()">连接设备</button>
                            <button class="btn btn-secondary" onclick="bleRestart()">重启</button>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalPower">0.0</div>
                        <div class="stat-label">总功率 (W)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value warning" id="maxVoltage">0.0</div>
                        <div class="stat-label">最高电压 (V)</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                功率曲线
                <div style="margin-left: auto; display: flex; gap: 4px;">
                    <button class="time-btn" onclick="setTimeRange(30)">30分</button>
                    <button class="time-btn active" onclick="setTimeRange(60)">60分</button>
                    <button class="time-btn" onclick="setTimeRange(90)">90分</button>
                    <button class="time-btn" onclick="setTimeRange(120)">120分</button>
                    <button class="time-btn" onclick="setTimeRange(1440)">24小时</button>
                </div>
            </div>
            <div class="chart-container"><canvas id="powerChart"></canvas></div>
        </div>

        <div class="card">
            <div class="card-title">端口监控 <span style="font-size:10px;color:var(--text-dim);text-transform:none;letter-spacing:0">(点击查看详情)</span></div>
            <div class="port-grid" id="portGrid"></div>
        </div>

        <!-- Charge History Card -->
        <div class="card">
            <div class="card-title">充电记录
                <button id="btnChargeHistory" style="margin-left:auto;background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text-dim);cursor:pointer;">历史记录</button>
            </div>
            <div id="currentC1" class="current-charge-card"></div>
            <div id="currentC2" class="current-charge-card"></div>
            <div id="chargeHistoryView" style="display:none;">
                <!-- 历史列表（详情打开时整体隐藏） -->
                <div id="historyListWrap">
                    <div class="charge-view-head">
                        <span class="charge-view-title">历史记录</span>
                        <button onclick="clearAllSessions()" class="btn-clear">清理</button>
                    </div>
                    <div id="historyListC1" class="history-group"></div>
                    <div id="historyListC2" class="history-group"></div>
                </div>
                <!-- 单次详情：原地替换历史列表 -->
                <div id="sessionDetail" style="display:none;">
                    <div class="sd-head">
                        <div class="sd-head-left">
                            <span id="sdTitle" class="sd-title"></span>
                            <span id="sdDuration" class="sd-duration"></span>
                        </div>
                        <button onclick="backToHistoryList()" class="btn-back">返回</button>
                    </div>
                    <div class="sd-stats">
                        <div class="sd-cell"><div class="sd-cell-value"><span id="sdEnergy">0</span><span class="sd-cell-unit"> Wh</span></div><div class="sd-cell-mah" id="sdEnergyMah"></div><div class="sd-cell-label">电量</div></div>
                        <div class="sd-cell"><div class="sd-cell-value"><span id="sdAvgP">0</span><span class="sd-cell-unit"> W</span></div><div class="sd-cell-label">平均功率</div></div>
                        <div class="sd-cell"><div class="sd-cell-value"><span id="sdPeakP">0</span><span class="sd-cell-unit"> W</span></div><div class="sd-cell-label">峰值功率</div></div>
                    </div>
                    <div class="sd-row2">
                        <div class="sd-cell"><div class="sd-cell-value"><span id="sdAvgV">0</span><span class="sd-cell-unit"> V</span></div><div class="sd-cell-label">平均电压</div></div>
                        <div class="sd-cell"><div class="sd-cell-value"><span id="sdAvgI">0</span><span class="sd-cell-unit"> A</span></div><div class="sd-cell-label">平均电流</div></div>
                    </div>
                    <div class="sd-chart"><canvas id="sessionChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">倒计时设置</div>
            <div class="countdown-grid" id="countdownGrid"></div>
        </div>

        <div class="card">
            <div class="card-title">设备设置</div>
            <div class="settings-grid" id="settingsGrid"></div>
        </div>

        <div class="footer">
            <a href="https://github.com/kairui1108/cuktech-ble-server" target="_blank" style="color: var(--accent); text-decoration: none;">CUKTECH-BLE-HA Web</a>
            <span style="margin: 0 12px; color: var(--text-dim);">|</span>
            <a href="config.html" style="color: var(--text-dim); text-decoration: none; font-size: 13px;">&#9881; 配置</a>
            <span style="margin: 0 12px; color: var(--text-dim);">|</span>
            <div class="theme-switcher" id="themeSwitcher">
                <button class="theme-btn" onclick="toggleThemeMenu()" id="themeBtn">🎨 主题</button>
                <div class="theme-menu" id="themeMenu">
                    <div class="theme-option" onclick="setTheme('ha-dark')" data-theme="ha-dark">
                        <span class="theme-dot" style="background: #1c1c1c;"></span> 暗色
                    </div>
                    <div class="theme-option" onclick="setTheme('deep-blue')" data-theme="deep-blue">
                        <span class="theme-dot" style="background: #0f0f1a;"></span> 深蓝
                    </div>
                    <div class="theme-option" onclick="setTheme('ocean')" data-theme="ocean">
                        <span class="theme-dot" style="background: #0a1628;"></span> 海洋
                    </div>
                    <div class="theme-option" onclick="setTheme('gray')" data-theme="gray">
                        <span class="theme-dot" style="background: #2d2d2d;"></span> 灰色
                    </div>
                    <div class="theme-option" onclick="setTheme('light')" data-theme="light">
                        <span class="theme-dot" style="background: #f5f5f5;"></span> 浅色
                    </div>
                    <div class="theme-option" onclick="setTheme('system')" data-theme="system">
                        <span class="theme-dot" style="background: linear-gradient(135deg, #1c1c1c 50%, #f5f5f5 50%);"></span> 跟随系统
                    </div>
                </div>
            </div>
            <span style="margin: 0 12px; color: var(--text-dim);">|</span>
            <div class="theme-switcher" id="logLevelSwitcher">
                <button class="theme-btn" onclick="toggleLogLevelMenu()" id="logLevelBtn">📋 日志</button>
                <div class="theme-menu" id="logLevelMenu">
                    <div class="theme-option" onclick="setLogLevel('debug')" data-level="debug">Debug</div>
                    <div class="theme-option" onclick="setLogLevel('info')" data-level="info">Info</div>
                    <div class="theme-option" onclick="setLogLevel('warning')" data-level="warning">Warning</div>
                    <div class="theme-option" onclick="setLogLevel('error')" data-level="error">Error</div>
                </div>
            </div>
            <span style="margin: 0 12px; color: var(--text-dim);">|</span>
            <button class="theme-btn" onclick="openBleLogModal()">🔗 蓝牙日志</button>
        </div>
    </div>

    <div class="modal-overlay" id="portModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">C1 端口详情</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-stats">
                <div class="power-item"><div class="power-value" id="modalVoltage">0.0</div><div class="power-label">电压 (V)</div></div>
                <div class="power-item"><div class="power-value success" id="modalCurrent">0.0</div><div class="power-label">电流 (A)</div></div>
                <div class="power-item"><div class="power-value warning" id="modalPower">0.0</div><div class="power-label">功率 (W)</div></div>
                <div class="power-item"><div class="power-value" id="modalProtocol">idle</div><div class="power-label">实时充电协议</div></div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:4px;margin:4px 0;">
                <button class="time-btn" id="modalRealTimeBtn" onclick="toggleModalRealTime()" style="font-size:10px;padding:2px 8px;">⚡ 实时</button>
            </div>
            <div class="modal-chart-container"><canvas id="modalChart"></canvas></div>
            <div class="modal-protocols" id="modalProtocols"></div>
        </div>
    </div>

    <div class="modal-overlay" id="bleLogModal">
        <div class="modal" style="max-width:600px;">
            <div class="modal-header">
                <span class="modal-title">蓝牙连接日志</span>
                <button class="modal-close" onclick="closeBleLogModal()">&times;</button>
            </div>
            <div id="bleLogList" style="max-height:400px;overflow-y:auto;font-size:12px;font-family:monospace;"></div>
        </div>
    </div>

    <script defer src="/static/app.js?v=9"></script>
</body>
</html>
